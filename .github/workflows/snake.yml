name: Matrix Profile Generative Suite

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"
      - "bonsai/**"

permissions:
  contents: write

jobs:
  generate:
    name: Generate Neo Pixel Cat & Matrix Snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate YourTomo Living Pixel Cat (prsdx/github-pet)
        uses: prsdx/github-pet@v1.3.0
        continue-on-error: true
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          timezone-offset-minutes: "330"
          display-name: "Harshal"
          pet-name: "Neo"
          accent-color: "#10b981"
          contact-line: "devharrycode.vercel.app"
          output-dir: "dist"

      - name: Generate Matrix Contribution Snake (Platane/snk)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist_snake/github-contribution-grid-snake.svg
            dist_snake/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#10b981&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push Matrix Snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist_snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
