name: Matrix Profile Generative Suite

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"
      - "bonsai/**"

permissions:
  contents: write

jobs:
  generate:
    name: Generate Pet, IsoCity, Bonsai, Gravity & Matrix Snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate YourTomo Living Pixel Cat & 3D IsoCity (prsdx/github-pet)
        uses: prsdx/github-pet@v1.3.0
        continue-on-error: true
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          timezone-offset-minutes: "330"
          display-name: "Harshal"
          pet-name: "Neo"
          accent-color: "#10b981"
          contact-line: "devharrycode.vercel.app"
          output-dir: "dist"

      - name: Grow 16-bit Pixel-Art Git Bonsai (egorthinks/git-bonsai)
        uses: egorthinks/git-bonsai@v1
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          output-dir: "bonsai"
          commit: "true"
          commit-message: "chore: tend the bonsai [skip ci]"
          season: "summer"

      - name: Prepare build directory for output branch
        run: mkdir -p build

      - name: Generate GitHub Gravity Physics Simulation (flycran/github-gravity)
        uses: flycran/github-gravity@v1
        continue-on-error: true
        with:
          username: ${{ github.repository_owner }}
          text: "MATRIX"
          output-path: build/gravity.svg
          font-size: "80"
          shape: "circle"
          background-color: "#0d1117"
          text-color: "#10b981"

      - name: Generate Matrix Contribution Snake (Platane/snk)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            build/github-contribution-grid-snake.svg
            build/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#10b981&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push Snake & Gravity SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
